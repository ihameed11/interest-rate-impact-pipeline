# Settings used by every Spark job in the cluster.

# Where the Spark manager is.
spark.master                    spark://spark-master:7077

# Extra library Spark downloads at start-up so it can read and write
# Azure Blob Storage directly (abfss://... addresses).
spark.jars.packages             org.apache.hadoop:hadoop-azure:3.3.4

# Memory per job: small enough to fit on a laptop.
spark.driver.memory             1g
spark.executor.memory           1g
spark.executor.cores            1

# Number of pieces data is split into when Spark regroups it.
# The default (200) is far too many for data this size.
spark.sql.shuffle.partitions    8
