# The local cluster. Each "service" below is one machine (container).
# Start everything:  docker compose up -d
# Stop everything:   docker compose down
#
# Hadoop part (this file so far):
#   namenode          - index of the file system (HDFS)
#   datanode1/2       - store the actual data, each block kept on both
#   resourcemanager   - hands out work (YARN)
#   nodemanager1/2    - do the work (run map and reduce tasks)
#
# Spark part:
#   spark-master      - hands out Spark work
#   spark-worker1/2   - run the Spark tasks
#
# Database:
#   postgres          - stores the results that Spark writes
#
# Database login comes from the .env file (copy .env.example to .env).

# Settings shared by every Hadoop machine: same image, built once.
x-hadoop: &hadoop
  image: irp-hadoop:3.4.1
  build:
    context: .
    dockerfile: docker/hadoop/Dockerfile
  networks:
    - cluster

# Settings shared by every Spark machine.
x-spark: &spark
  image: irp-spark:3.5.3
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  env_file: .env
  networks:
    - cluster

services:
  namenode:
    <<: *hadoop
    hostname: namenode
    command: ["namenode"]
    ports:
      - "9870:9870"   # HDFS web page: http://localhost:9870
    volumes:
      - namenode-data:/data/namenode
      - ./src:/opt/project/src     # our code, visible inside the container
      - ./data:/opt/project/data   # prepared inputs and job results

  datanode1:
    <<: *hadoop
    hostname: datanode1
    command: ["datanode"]
    depends_on: [namenode]
    volumes:
      - datanode1-data:/data/datanode

  datanode2:
    <<: *hadoop
    hostname: datanode2
    command: ["datanode"]
    depends_on: [namenode]
    volumes:
      - datanode2-data:/data/datanode

  resourcemanager:
    <<: *hadoop
    hostname: resourcemanager
    command: ["resourcemanager"]
    depends_on: [namenode]
    ports:
      - "8088:8088"   # YARN web page: http://localhost:8088

  nodemanager1:
    <<: *hadoop
    hostname: nodemanager1
    command: ["nodemanager"]
    depends_on: [resourcemanager]

  nodemanager2:
    <<: *hadoop
    hostname: nodemanager2
    command: ["nodemanager"]
    depends_on: [resourcemanager]

  # ---------------- Spark ----------------
  spark-master:
    <<: *spark
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"   # Spark web page: http://localhost:8080
    volumes:
      - ./config/hadoop:/opt/hadoop-conf:ro
      - ./src:/opt/project/src
      - ./scripts:/opt/project/scripts

  spark-worker1:
    <<: *spark
    hostname: spark-worker1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
    volumes:
      - ./config/hadoop:/opt/hadoop-conf:ro

  spark-worker2:
    <<: *spark
    hostname: spark-worker2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
    volumes:
      - ./config/hadoop:/opt/hadoop-conf:ro

  # ---------------- Database ----------------
  postgres:
    image: postgres:16
    hostname: postgres
    env_file: .env
    ports:
      - "5432:5432"   # so tools on your Mac (e.g. VS Code, DBeaver) can connect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cluster

# One private network so the machines can find each other by name.
networks:
  cluster:

# Named volumes keep HDFS data when containers are stopped and restarted.
volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
  postgres-data:
